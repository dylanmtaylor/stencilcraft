[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/stencilcraft", "apps/stencilcraft-cli", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
# foundation
kurbo = { version = "0.13", features = ["serde"] }
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
# ui
egui = "0.37"
eframe = { version = "0.37", features = ["persistence"] }
rfd = "0.17"
# Shared UI components and docking, pinned to the design-system branch.
craft-ui = { git = "https://github.com/aiongg/craft-libs.git", rev = "053c0043dc1c05e96118f94e429f363b0fd7362b", features = ["serde"] }
craft-theme = { git = "https://github.com/aiongg/craft-libs.git", rev = "053c0043dc1c05e96118f94e429f363b0fd7362b", features = ["serde"] }
craft-atomic = { git = "https://github.com/aiongg/craft-libs.git", rev = "053c0043dc1c05e96118f94e429f363b0fd7362b" }
craft-draw = { git = "https://github.com/aiongg/craft-libs.git", rev = "053c0043dc1c05e96118f94e429f363b0fd7362b", features = ["ui"] }
craft-settings = { git = "https://github.com/aiongg/craft-libs.git", rev = "053c0043dc1c05e96118f94e429f363b0fd7362b" }
craft-window = { git = "https://github.com/aiongg/craft-libs.git", rev = "053c0043dc1c05e96118f94e429f363b0fd7362b" }
# Reuse VectorCraft's Session command engine and curve-preserving geometry. StencilCraft adapts its
# flat millimetre document at the engine boundary; keep the full engine's optional font bundle off.
vectorcraft-engine = { git = "https://github.com/storytold/vectorcraft", rev = "6b3a6b8788ebcb420d69449199cbdf323888d27e", default-features = false }
vectorcraft-geom = { git = "https://github.com/storytold/vectorcraft", rev = "6b3a6b8788ebcb420d69449199cbdf323888d27e" }
vectorcraft-pathops = { git = "https://github.com/storytold/vectorcraft", rev = "6b3a6b8788ebcb420d69449199cbdf323888d27e" }
# internal
stencilcraft-geom = { path = "crates/geom" }
stencilcraft-doc = { path = "crates/doc" }
stencilcraft-kerf = { path = "crates/kerf" }
stencilcraft-tiling = { path = "crates/tiling" }
stencilcraft-svg = { path = "crates/svg" }
stencilcraft-dxf = { path = "crates/dxf" }
stencilcraft-gcode = { path = "crates/gcode" }
stencilcraft-engine = { path = "crates/engine" }
stencilcraft-machine = { path = "crates/machine" }
stencilcraft-mcp = { path = "crates/mcp" }
stencilcraft-ui-egui = { path = "crates/ui-egui" }
stencilcraft-testkit = { path = "crates/testkit" }

# Shipped code returns `Result`/`Option` instead of
# panicking (see AGENTS.md › Robustness). Tests may unwrap (clippy.toml).
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

# Workspace crates keep line tables, so panics and backtraces name file and line;
# dependencies carry no debug info. Full debug info would make the dev target dir
# several times larger.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1

# craft-ui uses the suite's egui and winit forks for shared IME and docking support.
[patch.crates-io]
# VectorCraft's PDF import/export dependencies use the matching Craft-Libs API revisions.
hayro-syntax = { git = "https://github.com/storytold/craft-libs", rev = "92d392cff132eaf53e13afff77f38b5c11b73aa0" }
hayro-interpret = { git = "https://github.com/storytold/craft-libs", rev = "92d392cff132eaf53e13afff77f38b5c11b73aa0" }
hayro-jbig2 = { git = "https://github.com/storytold/craft-libs", rev = "92d392cff132eaf53e13afff77f38b5c11b73aa0" }
hayro-cmap = { git = "https://github.com/storytold/craft-libs", rev = "92d392cff132eaf53e13afff77f38b5c11b73aa0" }
hayro-postscript = { git = "https://github.com/storytold/craft-libs", rev = "92d392cff132eaf53e13afff77f38b5c11b73aa0" }
krilla = { git = "https://github.com/storytold/craft-libs", rev = "92d392cff132eaf53e13afff77f38b5c11b73aa0" }
ecolor = { git = "https://github.com/aiongg/egui.git", rev = "35a72e6b786d65ba92532566251947d4b80c4611" }
emath = { git = "https://github.com/aiongg/egui.git", rev = "35a72e6b786d65ba92532566251947d4b80c4611" }
epaint = { git = "https://github.com/aiongg/egui.git", rev = "35a72e6b786d65ba92532566251947d4b80c4611" }
epaint_default_fonts = { git = "https://github.com/aiongg/egui.git", rev = "35a72e6b786d65ba92532566251947d4b80c4611" }
egui = { git = "https://github.com/aiongg/egui.git", rev = "35a72e6b786d65ba92532566251947d4b80c4611" }
egui-winit = { git = "https://github.com/aiongg/egui.git", rev = "35a72e6b786d65ba92532566251947d4b80c4611" }
egui-wgpu = { git = "https://github.com/aiongg/egui.git", rev = "35a72e6b786d65ba92532566251947d4b80c4611" }
egui_glow = { git = "https://github.com/aiongg/egui.git", rev = "35a72e6b786d65ba92532566251947d4b80c4611" }
egui_extras = { git = "https://github.com/aiongg/egui.git", rev = "35a72e6b786d65ba92532566251947d4b80c4611" }
egui_kittest = { git = "https://github.com/aiongg/egui.git", rev = "35a72e6b786d65ba92532566251947d4b80c4611" }
egui_system_font_provider = { git = "https://github.com/aiongg/egui.git", rev = "35a72e6b786d65ba92532566251947d4b80c4611" }
eframe = { git = "https://github.com/aiongg/egui.git", rev = "35a72e6b786d65ba92532566251947d4b80c4611" }
egui_demo_lib = { git = "https://github.com/aiongg/egui.git", rev = "35a72e6b786d65ba92532566251947d4b80c4611" }
