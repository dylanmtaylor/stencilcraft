[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/stencilcraft", "apps/stencilcraft-cli", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
# foundation
kurbo = { version = "0.13", features = ["serde"] }
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
# ui
egui = "0.37"
eframe = "0.37"
rfd = "0.17"
# internal
stencilcraft-geom = { path = "crates/geom" }
stencilcraft-doc = { path = "crates/doc" }
stencilcraft-kerf = { path = "crates/kerf" }
stencilcraft-tiling = { path = "crates/tiling" }
stencilcraft-svg = { path = "crates/svg" }
stencilcraft-dxf = { path = "crates/dxf" }
stencilcraft-gcode = { path = "crates/gcode" }
stencilcraft-engine = { path = "crates/engine" }
stencilcraft-mcp = { path = "crates/mcp" }
stencilcraft-ui-egui = { path = "crates/ui-egui" }
stencilcraft-testkit = { path = "crates/testkit" }

# VectorCraft never crashes: shipped code returns `Result`/`Option` instead of
# panicking (see AGENTS.md › Robustness). Tests may unwrap (clippy.toml).
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

# Workspace crates keep line tables, so panics and backtraces name file and line;
# dependencies carry no debug info. Full debug info would make the dev target dir
# several times larger.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
