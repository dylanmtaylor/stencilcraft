[package]
name = "stencilcraft"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "StencilCraft: the StencilCraft desktop app (cut preparation in pure Rust)"

[[bin]]
name = "stencilcraft"
path = "src/main.rs"

[dependencies]
craft-atomic = { workspace = true }
craft-settings = { workspace = true }
craft-theme = { workspace = true }
craft-ui = { workspace = true, features = ["window-frame"] }
craft-window = { workspace = true, features = ["egui"] }
eframe = { workspace = true }
rfd = { workspace = true }
serde = { workspace = true }
stencilcraft-doc = { workspace = true }
stencilcraft-dxf = { workspace = true }
stencilcraft-engine = { workspace = true }
stencilcraft-gcode = { workspace = true }
stencilcraft-geom = { workspace = true }
stencilcraft-kerf = { workspace = true }
stencilcraft-machine = { workspace = true }
stencilcraft-mcp = { workspace = true }
stencilcraft-svg = { workspace = true }
stencilcraft-tiling = { workspace = true }
stencilcraft-ui-egui = { workspace = true }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }

[lints]
workspace = true
