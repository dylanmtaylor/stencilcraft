[package]
name = "stencilcraft"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "StencilCraft: the StencilCraft desktop app (cut preparation in pure Rust)"

[[bin]]
name = "stencilcraft"
path = "src/main.rs"

[dependencies]
craft-jsonrpc = { workspace = true }
craft-atomic = { workspace = true }
craft-draw = { workspace = true }
craft-settings = { workspace = true }
craft-theme = { workspace = true }
craft-ui = { workspace = true, features = ["app"] }
craft-behavior = { workspace = true }
craft-host = { workspace = true }
craft-font-manager = { workspace = true, features = ["ui"] }
# Type › Spelling…: the Check Spelling dialog and the bundled English word list.
craft-text = { workspace = true, default-features = false, features = ["ui"] }
craft-keymap = { workspace = true }
craft-window = { workspace = true, features = ["ui"] }
eframe = { workspace = true }
rfd = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
stencilcraft-doc = { workspace = true }
stencilcraft-dxf = { workspace = true }
stencilcraft-engine = { workspace = true }
stencilcraft-gcode = { workspace = true }
stencilcraft-import = { workspace = true }
stencilcraft-generate = { workspace = true }
stencilcraft-geom = { workspace = true }
stencilcraft-kerf = { workspace = true }
stencilcraft-machine = { workspace = true }
stencilcraft-mcp = { workspace = true }
stencilcraft-raster = { workspace = true }
stencilcraft-svg = { workspace = true }
stencilcraft-tiling = { workspace = true }
stencilcraft-ui-egui = { workspace = true }
craft-raster-codecs = { workspace = true }
kurbo = { workspace = true }
tiny-skia = { workspace = true }

[dev-dependencies]
# A font built in code for the font-file test (no font file in this repository).
vectorcraft-text = { workspace = true, features = ["test-fonts"] }
# The menu-label test reads labels with the pin's own mnemonic reader, which takes a Folder.
craft-i18n = { workspace = true }

[features]
default = ["usb", "bluetooth"]
usb = ["stencilcraft-engine/usb"]
bluetooth = ["stencilcraft-engine/bluetooth"]

[lints]
workspace = true
