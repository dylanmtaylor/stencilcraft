<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    StencilCraft app icon: a paper stencil with a bridged ring cut out of it,
    and a craft knife finishing a dashed cut. Original art by StencilCraft
    contributors, licensed MIT OR Apache-2.0 (see ASSETS.md).
  -->
  <rect width="512" height="512" rx="112" fill="#e8573f"/>
  <g transform="rotate(-6 256 256)">
    <!-- The stencil sheet. -->
    <rect x="104" y="84" width="288" height="320" rx="14" fill="#efe9dc" stroke="#0b0b0c" stroke-width="14" stroke-linejoin="round"/>
    <!-- The ring cut-out: the field shows through around a paper island. -->
    <path d="M248 126 a100 100 0 1 0 0.01 0 Z M248 180 a46 46 0 1 1 -0.01 0 Z"
      fill="#e8573f" fill-rule="evenodd" stroke="#0b0b0c" stroke-width="10"/>
    <!-- Stencil bridges holding the island in place. -->
    <g fill="#efe9dc">
      <rect x="239" y="118" width="18" height="66"/>
      <rect x="239" y="268" width="18" height="66"/>
    </g>
    <!-- The cut still to make, along the bottom of the sheet. -->
    <line x1="140" y1="364" x2="286" y2="364" stroke="#0b0b0c" stroke-width="12"
      stroke-dasharray="22 14" stroke-linecap="butt"/>
  </g>
  <!-- Craft knife, tip on the end of the cut: paper blade, paper collar, ink handle. -->
  <g transform="translate(296 362) rotate(-45)" stroke="#0b0b0c" stroke-width="8" stroke-linejoin="round">
    <path d="M0 -2 L56 -16 L56 14 Z" fill="#efe9dc"/>
    <rect x="56" y="-20" width="26" height="40" rx="4" fill="#efe9dc"/>
    <rect x="82" y="-17" width="150" height="34" rx="12" fill="#0b0b0c"/>
  </g>
</svg>
