[package]
name = "stencilcraft-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "StencilCraft command model, undo/redo, and document editing"

[dependencies]
craft-svg = { workspace = true }
kurbo = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
stencilcraft-machine = { workspace = true }
stencilcraft-doc = { workspace = true }
stencilcraft-geom = { workspace = true }
stencilcraft-raster = { workspace = true }
stencilcraft-kerf = { workspace = true }
stencilcraft-generate = { workspace = true }
stencilcraft-layout = { workspace = true }
vectorcraft-engine = { workspace = true }
vectorcraft-geom = { workspace = true }
vectorcraft-pathops = { workspace = true }
vectorcraft-text = { workspace = true }

[features]
usb = ["stencilcraft-machine/usb"]
bluetooth = ["stencilcraft-machine/bluetooth"]

[dev-dependencies]
craft-raster-codecs = { workspace = true }
serde_json = { workspace = true }
# Fonts built in code for tests (no font file in this repository).
vectorcraft-text = { workspace = true, features = ["test-fonts"] }
stencilcraft-svg = { workspace = true }

[lints]
workspace = true
