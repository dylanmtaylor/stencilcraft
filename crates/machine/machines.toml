# ------------------------------------------------------------------ Generic

[[machine]]
id = "generic-gpgl"
name = "Generic GP-GL plotter"
vendor = "Generic"
protocol = "gpgl"
roll_feed = true
tool_holders = 1
tools = ["drag-blade", "pen"]
speed = { min = 1, max = 10, unit = "steps" }
notes = "Any GP-GL plotter at 0.1 mm steps. Speed 1-10 is the GP-GL `!` scale (fraction of the machine's maximum); force is model-specific: set it on the panel. Pass the loaded media size."

[[machine]]
id = "generic-hpgl"
name = "Generic HP-GL cutter"
vendor = "Generic"
protocol = "hpgl"
roll_feed = true
tool_holders = 1
tools = ["drag-blade", "pen"]
notes = "Roland, USCutter, Vinyl Express and most sign cutters in HP-GL mode. Force and speed on the panel. Pass the loaded media size."

[[machine]]
id = "generic-dmpl"
name = "Generic DMPL cutter"
vendor = "Generic"
protocol = "dmpl"
support = "experimental"
roll_feed = true
tool_holders = 1
tools = ["drag-blade", "pen"]
notes = "Experimental: DMPL framing is not verified against a published manual. Test on scrap. Force and speed on the panel. Pass the loaded media size."

[[machine]]
id = "grbl-laser"
name = "Grbl laser / knife (G-code)"
vendor = "Generic"
protocol = "gcode"
tool_holders = 1
tools = ["laser", "drag-blade", "pen"]
force = { min = 0, max = 1000, unit = "S (spindle/laser power, Grbl $30=1000)" }
speed = { min = 1, max = 60000, unit = "mm/min" }
notes = "Grbl-style G-code over USB-CDC serial. Force maps to laser power S. Pass the work area as the media size. Pause (!), resume (~) and cancel (Ctrl-X) are Grbl real-time commands."

