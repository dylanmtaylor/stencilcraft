# StencilCraft machine registry: one [[machine]] per model. Adding a model is
# data, not code: pick an existing `protocol`, fill in what is documented, and
# leave everything else out — a missing value means "not publicly documented",
# and the encoder then refuses (never guesses). Users can add or override
# entries with their own file of the same shape (`--machines FILE`).
#
# Fields:
#   id, name, vendor        identity (id is the CLI/MCP handle)
#   protocol                silhouette-legacy | silhouette-cameo3 | silhouette-cameo4 |
#                           gpgl | hpgl | dmpl | gcode | export-only | unsupported
#   support                 supported | experimental | export-only | unsupported
#   usb = "vvvv:pppp"       USB vendor:product id
#   firmware                substring of the firmware (`FG`) reply identifying it
#   cut_width_mm/cut_length_mm, media_width_mm
#   roll_feed               cuts from a roll / without a mat
#   mats                    TG mat ids: 12x12 12x24 8x12 15x15 24x24 8.5x12
#   tool_holders, tools     see ToolKind ids in docs/machine-architecture.md
#   force/speed = { min, max, unit }   ranges the encoder may send; absent = panel only
#   max_force_gf, bluetooth, regmarks, quad_regmarks, notes
#
# Sources per row: docs/machine.md ("What is verified vs unknown").

