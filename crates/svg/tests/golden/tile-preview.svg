<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="68.000mm" height="93.000mm" viewBox="0.000 0.000 68.000 93.000">
  <title>StencilCraft tiling preview: 3 sheets, 2 × 2 cells</title>
  <style>.preview-frame { fill: none; stroke: #9aa0a6; stroke-width: 0.25; }
.stencilcraft-cut { fill: none; stroke: #c0392b; stroke-width: 0.3; }
.stencilcraft-engrave { fill: none; stroke: #2d6cdf; stroke-width: 0.2; }
.preview-label { fill: #5f6368; font-family: sans-serif; font-size: 3.2px; }</style>
  <g class="sheet" data-sheet="0" data-size="100.0x150.0">
    <text x="6.000" y="47.900" class="preview-label">sheet 1 of 3 · 100×150 mm</text>
    <rect x="6.000" y="49.500" width="25.000" height="37.500" class="preview-frame"/>
    <g transform="translate(6.000 87.000) scale(0.2500 -0.2500)">
      <g data-kind="cut" style="display:visible">
        <path d="M10,10 L60,10 L60,60 L10,60 Z" class="stencilcraft-cut"/>
        <path d="M70,20 L85,20 L85,60 L70,60 Z" class="stencilcraft-cut"/>
      </g>
      <g data-kind="engrave" style="display:visible">
        <path d="M10,90 L90,90" class="stencilcraft-engrave"/>
      </g>
    </g>
  </g>
  <g class="sheet" data-sheet="1" data-size="100.0x150.0">
    <text x="37.000" y="47.900" class="preview-label">sheet 2 of 3 · 100×150 mm</text>
    <rect x="37.000" y="49.500" width="25.000" height="37.500" class="preview-frame"/>
    <g transform="translate(37.000 87.000) scale(0.2500 -0.2500)">
      <g data-kind="engrave" style="display:visible">
        <path d="M5,90 L95,90" class="stencilcraft-engrave"/>
      </g>
    </g>
  </g>
  <g class="sheet" data-sheet="2" data-size="60.5x150.0">
    <text x="6.000" y="4.400" class="preview-label">sheet 3 of 3 · 60×150 mm</text>
    <rect x="6.000" y="6.000" width="15.125" height="37.500" class="preview-frame"/>
    <g transform="translate(6.000 43.500) scale(0.2500 -0.2500)">
      <g data-kind="cut" style="display:visible">
        <path d="M10,10 L60,10 L60,60 L10,60 Z" class="stencilcraft-cut"/>
        <path d="M70,20 L85,20 L85,60 L70,60 Z" class="stencilcraft-cut"/>
      </g>
      <g data-kind="engrave" style="display:visible">
        <path d="M10,90 L90,90" class="stencilcraft-engrave"/>
      </g>
    </g>
  </g>
</svg>