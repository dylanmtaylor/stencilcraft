# Flatpak manifest for StencilCraft (from-source build).
id: ai.storyteller.stencilcraft
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: stencilcraft
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --filesystem=xdg-documents
  - --filesystem=xdg-pictures
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
modules:
  - name: stencilcraft
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/stencilcraft/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline build --release --locked -p stencilcraft -p stencilcraft-cli
      - install -Dm755 target/release/stencilcraft /app/bin/stencilcraft
      - install -Dm755 target/release/stencilcraft-cli /app/bin/stencilcraft-cli
      - install -Dm644 packaging/linux/ai.storyteller.stencilcraft.desktop /app/share/applications/ai.storyteller.stencilcraft.desktop
      - install -Dm644 packaging/linux/ai.storyteller.stencilcraft.mime.xml /app/share/mime/packages/ai.storyteller.stencilcraft.xml
      - mkdir -p /app/share/icons && cp -R assets/app-icon/hicolor /app/share/icons/
      - >-
        version=$(awk '/^\[/{p=($0=="[workspace.package]");next} p&&$1=="version"{gsub(/[" ]/,"",$3);print $3;exit}' Cargo.toml);
        install -d /app/share/metainfo;
        sed -e "s/@VERSION@/$version/" -e "s/@DATE@/$(date -u +%Y-%m-%d)/"
        packaging/linux/ai.storyteller.stencilcraft.metainfo.xml.in > /app/share/metainfo/ai.storyteller.stencilcraft.metainfo.xml
    sources:
      - type: dir
        path: ../../..
        skip:
          - target
          - dist
          - build-flatpak
          - .flatpak-builder
      - cargo-sources.json
